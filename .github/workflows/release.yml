name: Release

# Publishes a release whenever manifest.json's version has no release yet.
on:
  push:
    paths: ["manifest.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: echo "TAG=v$(jq -r .version manifest.json)" >> "$GITHUB_ENV"

      - name: Build zip and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          ZIP="hard-refresh-nuke-$TAG.zip"
          zip -r "$ZIP" manifest.json *.js *.html *.css icons
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
